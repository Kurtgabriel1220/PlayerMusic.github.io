<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Player Music</title>
</head>
<body>
    <img src="https://i.ytimg.com/vi/b4Fdpl5g5ys/hqdefault.jpg?sqp=-oaymwEnCPYBEIoBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLAj1tDcRkpf1f6HRPT-1gwnUNdOrA" class="img">
    <div class="description">
        <h2 class="musicName">Música do JJ</h2>
        <i class="singerName">????</i>
    </div>
    <div class="duracao">
        <div class="barra">
            <progress id="progress" value="0" max="1"></progress>
            <div class="point">

            </div>
        </div>
        <div class="time">
            <p class="inicio">0:00</p>
            <p class="fim">4:24</p>
        </div>
    </div>

    <div class="player">
        <i class="fa-solid fa-backward setas anterior"></i>
        <i class="fa-solid fa-circle-play botaoPlay" ></i>
        <i class="fa-solid fa-circle-pause botaoPause"></i>
        <i class="fa-solid fa-forward setas proximo"></i>
    </div>
    <audio src="musics/MÚSICA QUE JJ USAR NO FINAL DOS VÍDEOS 🎵. [b4Fdpl5g5ys].mp3"></audio>
    
    <script src="script.js"></script>
</body>
</html>
